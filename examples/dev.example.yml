# 本地调试模板——⚠️ 仅适用于「从 dsh 源码仓库运行」的场景：
# 检出 deepseek-harness 后，在其仓库根目录执行（其开发 loader 支持路径加载 TS 源码）：
#   pnpm dsh web --patch /绝对路径/llamapad-dsh-plugin/examples/dev.example.yml
#
# 安装版 dsh（npx/全局）的 --patch 不解析模块路径行，会静默忽略本文件——
# 那种情况请用 profile 方式（README「本地调试」方式一）：
#   dsh plugin --profile web add /绝对路径/llamapad-dsh-plugin
#   # 配置写 ~/.dsh/profiles/web/cordis.patch.yml（模板 examples/profile-patch.example.yml）
#
# 本地私有副本 examples/dev.yml 已 gitignore；name 相对路径按 dsh 进程工作目录解析。
- id: llamapad
  name: './src/index.ts'
  config:
    panelUrl: !!js process.env.LLAMAPAD_URL || 'http://192.168.1.10:8080'
    token: !!js process.env.LLAMAPAD_TOKEN || ''
    # mode: direct
    # llamaBaseUrl: http://192.168.1.10:18080

# agent 默认走 llamapad（可选，不需要可整块删掉；模型名用 LLAMAPAD_MODEL 覆盖）：
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents:
      - id: main
        provider: llamapad
        model: !!js process.env.LLAMAPAD_MODEL || 'qwen3-8b-q4'
