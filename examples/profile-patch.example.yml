# 用户层配置示例：bundle 安装后（dsh plugin --profile <名> add ...），
# 把这里的行放进 profile 目录的 cordis.patch.yml（$DSH_HOME/profiles/<名>/cordis.patch.yml）。
# 覆盖按 id 匹配、整行替换 config，与 bundle 层的 llamapad 行对应。
- id: llamapad
  name: llamapad-dsh-plugin
  config:
    panelUrl: http://192.168.1.10:8080
    token: !!js process.env.LLAMAPAD_TOKEN
    # 设置卡片里「在浏览器中打开面板」按钮用的地址。缺省回落 panelUrl，同机部署不用配；
    # 但 panelUrl 是 dsh host 进程视角的地址（常见 127.0.0.1），而这颗按钮是在**用户的
    # 浏览器**里打开的——跨机访问 dsh 时两者不是一回事，必须显式配成浏览器能到达的地址：
    # panelPublicUrl: http://192.168.1.10:8080
    # 远程/端口不暴露时用默认 proxy 模式；同机低延迟可改 direct：
    # mode: direct
    # llamaBaseUrl: http://192.168.1.10:18080

# 让 agent 默认使用 llamapad 模型（provider 对应上面 config.provider，
# model 为面板里的模型配置名；不需要 agent 默认切模型时可整段删掉）：
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents:
      - id: main
        provider: llamapad
        model: qwen3-8b-q4

# ---- B 形态（管理工具插件）：任意模型驱动的 Agent 可调用工具查询/启停本地模型 ----
# 不随 bundle 默认挂载（包内 cordis.patch.yml 只 insert 了上面 A 形态那一行），需要时
# 把下面取消注释放进 profile 的 cordis.patch.yml。可以只挂 B、只挂 A，或两个同时挂——
# 两个入口的 Config 相互独立，各自填一份 panelUrl/token 即可。
#
# 注意这里必须用 `insert:` 而不是上面 A 形态那种「按 id 覆盖」的写法：覆盖只能改动
# 已存在于组合树里的条目，B 入口没被任何 bundle 层声明过，写成覆盖形式会得到
# `patch: entry "llamapad-tools" not found` 并**静默不注册**（实测 dsh 0.1.1-rc.2）。
# - insert:
#     - id: llamapad-tools
#       name: llamapad-dsh-plugin/tools
#       config:
#         panelUrl: http://192.168.1.10:8080
#         token: !!js process.env.LLAMAPAD_TOKEN
