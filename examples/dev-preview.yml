# 本地调试预览（不发布版本、不动 profile）：--patch 直接把插件叠加到 dsh 上。
# 用法（绝对路径按实际修改；npx 安装的 dsh CLI 同样可用）：
#   LLAMAPAD_TOKEN=lp_xxx dsh web --patch /absolute/path/to/llamapad-dsh-plugin/examples/dev-preview.yml
# name 直挂 TS 源码，无需构建（已实测安装版 CLI 可加载 .ts）；想贴近构建产物时
# 先 npm run build，再改成 dist/index.js。改完代码重启 dsh 即生效。
- id: llamapad
  name: '/absolute/path/to/llamapad-dsh-plugin/src/index.ts'
  config:
    panelUrl: http://192.168.1.10:8080
    token: !!js process.env.LLAMAPAD_TOKEN
    # mode: direct
    # llamaBaseUrl: http://192.168.1.10:18080

# agent 默认走 llamapad（可选，不需要可删）：
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents:
      - id: main
        provider: llamapad
        model: qwen3-8b-q4
